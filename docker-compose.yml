# ============================================================
# AI Agent助手 - Docker Compose
# ============================================================
# 启动: docker-compose up -d
# 停止: docker-compose down
# ============================================================

version: "3.8"

services:
  agent-api:
    build: .
    container_name: ai-agent-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/faiss_memory:/app/backend/faiss_memory
      - ./backend/faiss_docs:/app/backend/faiss_docs
      - ./backend/docs:/app/backend/docs
      - ./backend/config.yaml:/app/backend/config.yaml
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SERPAPI_KEY=${SERPAPI_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - HF_ENDPOINT=https://hf-mirror.com
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  agent-web:
    build: .
    container_name: ai-agent-web
    command: python main.py web --host 0.0.0.0 --port 7860
    ports:
      - "7860:7860"
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/faiss_memory:/app/backend/faiss_memory
      - ./backend/config.yaml:/app/backend/config.yaml
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - HF_ENDPOINT=https://hf-mirror.com
    depends_on:
      - agent-api
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
